name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  docker:
    # Same image Render builds; checks it starts on Render's injected PORT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yt-audio-api .
      - run: docker run --rm --entrypoint ffmpeg yt-audio-api -version | head -1
      - run: |
          docker run -d --name api -p 10000:10000 -e PORT=10000 -e API_KEY=ci yt-audio-api
          for i in $(seq 30); do curl -fsS localhost:10000/health && exit 0; sleep 1; done
          docker logs api; exit 1
